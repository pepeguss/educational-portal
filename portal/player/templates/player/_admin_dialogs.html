<dialog id="editor-dialog" aria-labelledby="editor-title" class="m-auto bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 backdrop:bg-black/50">
  <form id="editor-form" class="space-y-4">
    {% csrf_token %}
    <h3 id="editor-title" class="text-lg font-semibold"></h3>
    <label class="block">
      <span class="text-sm font-medium text-gray-700">Название</span>
      <input id="editor-name" name="title" required maxlength="200" autofocus class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
    </label>
    <label id="editor-description-field" class="hidden block">
      <span class="text-sm font-medium text-gray-700">Описание</span>
      <textarea id="editor-description" name="description" rows="4" class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none"></textarea>
    </label>
    <fieldset id="editor-access-options" class="hidden space-y-3">
      <legend class="text-sm font-medium text-gray-700 mb-2">Кто видит лекцию</legend>
      <label class="flex items-center gap-2 text-sm">
        <input type="radio" name="visibility" value="all" checked class="accent-amber-500"> Все пользователи
      </label>
      <label class="flex items-center gap-2 text-sm">
        <input type="radio" name="visibility" value="departments" class="accent-amber-500"> Выбранные отделы
      </label>
      <div id="editor-departments" class="hidden space-y-2 max-h-48 overflow-y-auto border border-gray-200 rounded-lg p-3">
        {% for department in departments %}
          <label class="flex items-center gap-2 text-sm">
            <input type="checkbox" name="departments" value="{{ department.id }}" class="accent-amber-500"> {{ department.name }}
          </label>
        {% empty %}
          <p class="text-sm text-gray-500">Сначала создайте отдел в админке.</p>
        {% endfor %}
      </div>
      <p class="text-xs text-gray-500">Администраторы видят все лекции.</p>
    </fieldset>
    <div id="editor-test-options" class="hidden space-y-3">
      <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
        <input id="editor-has-test" type="checkbox" name="has_test" class="accent-amber-500">
        Тест для оценки знаний
      </label>
      <label id="editor-test-field" class="hidden block">
        <span class="text-sm font-medium text-gray-700">Ссылка на тест</span>
        <input id="editor-test-url" type="url" name="test_url" maxlength="2000" placeholder="https://forms.yandex.ru/u/6ab3773384227cdc0ddbd671" disabled class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
        <span class="block mt-1 text-xs text-gray-500">Допускается только HTTPS-ссылка на Яндекс Форму (forms.yandex.ru или forms.yandex.com). Тест появится под плеером. HTML-код вставлять не нужно.</span>
      </label>
    </div>
    <p id="editor-error" role="alert" class="hidden text-sm text-red-600"></p>
    <div class="flex justify-end gap-2">
      <button id="editor-cancel" type="button" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition disabled:opacity-50">Отмена</button>
      <button id="editor-save" type="submit" class="px-4 py-2 rounded-lg bg-graphite-900 text-white hover:bg-graphite-700 transition disabled:opacity-50">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="files-dialog" aria-labelledby="files-title" class="m-auto bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 backdrop:bg-black/50">
  <h3 id="files-title" class="text-lg font-semibold mb-4">Файлы лекции</h3>
  <div id="files-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
  <p id="files-empty" class="text-sm text-gray-400 text-center py-4">Файлов пока нет</p>
  <label class="block mt-4">
    <span class="text-sm font-medium text-gray-700">Загрузить файл (PDF, DOCX, PPTX, MP4, MP3)</span>
    <input id="file-input" type="file" accept=".pdf,.docx,.pptx,.mp4,.mp3" class="mt-1 block w-full text-sm file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-amber-500 file:text-graphite-900 file:font-medium hover:file:bg-amber-600 disabled:opacity-50">
    <span class="block mt-2 text-xs text-gray-500">PPTX до 100 МБ. Подготовка слайдов может занять до двух минут. Анимация и видео внутри презентации не воспроизводятся.</span>
  </label>
  <p id="files-error" role="alert" class="hidden mt-3 text-sm text-red-600"></p>
  <div class="flex justify-end mt-6">
    <button id="files-close" type="button" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition disabled:opacity-50">Закрыть</button>
  </div>
</dialog>

<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description" class="m-auto bg-white rounded-2xl shadow-xl w-full max-w-md overflow-y-auto p-6 backdrop:bg-black/50">
  <form id="delete-form">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="w-12 h-12 rounded-full bg-red-50 text-red-600 flex items-center justify-center" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg>
      </div>
      <button id="delete-close" type="button" aria-label="Закрыть окно" class="w-10 h-10 rounded-lg text-gray-500 hover:bg-gray-100 disabled:opacity-50">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mx-auto"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <h3 id="delete-title" class="text-xl font-semibold text-graphite-900 mb-2"></h3>
    <p id="delete-description" class="text-sm text-gray-500 leading-relaxed"></p>
    <p class="text-sm text-red-600 mt-3">Это действие нельзя отменить.</p>
    <p id="delete-error" role="alert" class="hidden mt-3 text-sm text-red-600"></p>
    <div class="flex flex-wrap justify-end gap-2 mt-6">
      <button id="delete-cancel" type="button" autofocus class="px-4 py-2 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-100 disabled:opacity-50">Отмена</button>
      <button id="delete-confirm" type="submit" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 disabled:opacity-50"></button>
    </div>
  </form>
</dialog>

<template id="file-row-template">
  {% include "player/_admin_file_row.html" with file=None %}
</template>
