{% extends "player/_learning_base.html" %}
{% load static %}
{% block title %}Главная — Прииск Удерейский{% endblock %}

{% block learning_content %}
  <main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-3xl mx-auto text-center py-20">
      <div class="w-32 h-32 mx-auto rounded-2xl flex items-center justify-center">
          <img src="{% static "img/logo.png" %}" class="w-32 h-32 object-contain">
      </div>
      <h2 class="text-3xl font-semibold text-graphite-900 mb-3">Добро пожаловать, {{ user.full_name }}!</h2>
      <p class="text-gray-500 max-w-md mx-auto">Выберите раздел в левой панели, чтобы начать обучение.</p>
    </div>
  </main>
{% endblock %}
