{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Прииск Удерейский{% endblock %}</title>


  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            graphite: { 50:'#f6f7f8', 100:'#e6e8eb', 500:'#3a3f47', 700:'#2a2e35', 900:'#1a1d23' },
            amber:    { 500:'#f5b301', 600:'#d99c00' },
          },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="antialiased">

  {% block body %}{% endblock %}

  <!-- Модальное окно (общее) -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 fade-in">
      <h3 id="modal-title" class="text-lg font-semibold mb-4"></h3>
      <div id="modal-body" class="space-y-3"></div>
      <div class="flex justify-end gap-2 mt-6">
        <button id="modal-cancel" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 transition">Отмена</button>
        <button id="modal-ok" class="px-4 py-2 rounded-lg bg-graphite-900 text-white hover:bg-graphite-700 transition">Сохранить</button>
      </div>
    </div>
  </div>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
